<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pattern Mind — Mind Trainer #4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0d0a1a;color:#fff;font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;overflow-x:hidden}
#wrap{width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:30px;margin:10px 0 2px;background:linear-gradient(90deg,#b366ff,#5ac8fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#9a8fc0;font-size:13px;margin-bottom:10px}
#hud{width:100%;display:flex;justify-content:space-between;align-items:center;background:#1a1430;border:2px solid #7a5cc8;border-radius:14px;padding:8px 14px;margin-bottom:10px;font-size:15px}
#hud b{color:#ffd93d}
#lives{color:#ff6b6b;letter-spacing:2px}
#tbar{width:100%;height:8px;background:#241d45;border-radius:4px;margin-bottom:12px;overflow:hidden}
#tfill{height:100%;background:linear-gradient(90deg,#35dd35,#ffd93d);width:100%;transition:width .1s linear}
#prompt{font-size:18px;color:#cfc4f5;margin-bottom:12px;text-align:center;min-height:28px}
#board{display:grid;gap:8px;justify-content:center;margin-bottom:12px}
.tile{background:#241d45;border:2px solid #4a3f7a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;transition:transform .08s;min-width:64px;min-height:64px}
.tile:active{transform:scale(.92)}
.tile.pick{border-color:#ffd93d;background:#2e2554}
.tile.correct{border-color:#35dd35;background:#1d3a24;animation:pop .3s}
.tile.wrong{border-color:#ff4444;background:#3a1d1d;animation:shake .3s}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
#msg{font-size:16px;min-height:24px;color:#ffd93d;text-align:center;margin-bottom:8px}
.screen{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}
.bigbtn{background:linear-gradient(180deg,#7a5cc8,#5a3fa8);border:none;color:#fff;font-size:20px;font-weight:800;padding:16px 44px;border-radius:16px;cursor:pointer;margin-top:14px;box-shadow:0 4px 0 #3a2a70}
.bigbtn:active{transform:translateY(3px);box-shadow:none}
.stat{background:#1a1430;border-radius:12px;padding:10px 18px;margin:6px;font-size:17px}
.stat b{color:#ffd93d}
#verdict{color:#b79bff;font-style:italic;margin-top:10px;text-align:center;max-width:380px}
.mode-tag{display:inline-block;background:#2e2554;border:1px solid #7a5cc8;border-radius:20px;padding:3px 12px;font-size:12px;color:#b79bff;margin-bottom:8px}
</style>
</head>
<body>
<div id="wrap">
  <div id="menu" class="screen">
    <h1>🧠 PATTERN MIND</h1>
    <div class="sub">Mind Trainer #4 — pattern recognition</div>
    <div class="stat">Find the odd one out · complete the sequence · crack the matrix</div>
    <div class="stat">Best: <b id="menuBest">0</b></div>
    <button class="bigbtn" id="startBtn">START</button>
    <div id="verdict">Hades &amp; Lilith are watching. Don't embarrass yourself.</div>
  </div>
  <div id="game" class="screen" style="display:none">
    <div id="hud"><span>LV <b id="lvl">1</b></span><span id="lives">❤❤❤</span><span>Score <b id="score">0</b></span></div>
    <div id="tbar"><div id="tfill"></div></div>
    <div class="mode-tag" id="mtag">ODD ONE OUT</div>
    <div id="prompt"></div>
    <div id="board"></div>
    <div id="opts"></div>
    <div id="msg"></div>
  </div>
  <div id="over" class="screen" style="display:none">
    <h1>💀 GAME OVER</h1>
    <div class="stat">Score: <b id="fScore">0</b></div>
    <div class="stat">Level reached: <b id="fLvl">1</b></div>
    <div class="stat">Best: <b id="fBest">0</b></div>
    <div id="verdict"></div>
    <button class="bigbtn" id="againBtn">AGAIN</button>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let best=+(localStorage.getItem('pm_best')||0); $('menuBest').textContent=best;
let lvl,score,lives,mode,roundT,roundMax,timerId,lock,roundStart,gridN;

// iOS-hardened tap
function onTap(el,fn){let sx=0,sy=0,dn=false,last=0;
 el.addEventListener('pointerdown',e=>{dn=true;sx=e.clientX;sy=e.clientY;});
 el.addEventListener('pointerup',e=>{if(!dn)return;dn=false;
  if(Math.hypot(e.clientX-sx,e.clientY-sy)>12)return;
  const n=Date.now();if(n-last<500)return;last=n;fn(e);});
 el.addEventListener('click',e=>{const n=Date.now();if(n-last<700)return;last=n;fn(e);});}

const ODD_PAIRS=[["😀","😃"],["🍏","🍎"],["🔵","🟣"],["🐶","🐱"],["⭐","🌟"],["🟥","🟧"],["🐺","🦊"],["💧","💦"],["🌙","🌜"],["🔺","🔻"]];
const SHAPES=["🔴","🟠","🟡","🟢","🔵","🟣"];
const EMOJI_SEQ=[["🐶","🐱","🐭","🐹","🐰","🦊"],["🍎","🍊","🍋","🍇","🫐","🍓"],["⚽","🏀","🏈","⚾","🎾","🏐"]];

function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function setMode(m){
 mode=m;
 $('mtag').textContent=m==='odd'?"ODD ONE OUT":m==='seq'?"SEQUENCE":"MATRIX";
}
function timeFor(){return Math.max(4000,12000-lvl*700);}

function startRound(){
 lock=false;$('msg').textContent='';$('board').innerHTML='';$('opts').innerHTML='';$('board').style.display='grid';
 const modes=['odd','seq','matrix'];
 setMode(modes[(lvl-1)%3]);
 roundMax=timeFor();roundT=roundMax;roundStart=Date.now();
 clearInterval(timerId);
 timerId=setInterval(()=>{roundT-=100;$('tfill').style.width=(100*roundT/roundMax)+'%';
  if(roundT<=0){clearInterval(timerId);timeout();}},100);
 $('tfill').style.width='100%';
 if(mode==='odd')buildOdd();else if(mode==='seq')buildSeq();else buildMatrix();
}
function endRoundUI(){$('board').style.display='none';}

function addScore(){const bonus=Math.round(100+lvl*25+roundT/40);score+=bonus;$('score').textContent=score;
 $('msg').textContent='+'+bonus+' — sharp!';}
function fail(msg){lives--;$('lives').textContent='❤'.repeat(Math.max(0,lives))+'🖤'.repeat(3-Math.max(0,lives));
 $('msg').textContent=msg||'Wrong!';
 if(lives<=0){setTimeout(gameOver,700);}else{setTimeout(()=>{startRound();},900);}}
function timeout(){lock=true;$('msg').textContent='Too slow!';fail('Too slow!');}

// ---- MODE 1: odd one out ----
function buildOdd(){
 gridN=Math.min(3+Math.floor(lvl/2),7);
 const pair=rnd(ODD_PAIRS);
 const oddIdx=Math.floor(Math.random()*gridN*gridN);
 $('prompt').textContent='Tap the odd one out!';
 const b=$('board');b.style.gridTemplateColumns=`repeat(${gridN},1fr)`;
 for(let i=0;i<gridN*gridN;i++){
  const t=document.createElement('div');t.className='tile';t.textContent=(i===oddIdx?pair[1]:pair[0]);
  t.style.fontSize=Math.max(20,44-gridN*3)+'px';
  onTap(t,()=>{if(lock)return;lock=true;clearInterval(timerId);
   if(i===oddIdx){t.classList.add('correct');addScore();setTimeout(nextLevel,600);}
   else{t.classList.add('wrong');fail('Not that one!');}});
  b.appendChild(t);
 }
}
// ---- MODE 2: sequence ----
function buildSeq(){
 endRoundUI();
 const kind=Math.floor(Math.random()*3);let seq,answer,options;
 if(kind===0){ // ABAB pattern
  const a=rnd(SHAPES);let b=rnd(SHAPES);while(b===a)b=rnd(SHAPES);
  const n=4+Math.min(2,Math.floor(lvl/3));
  seq=[];for(let i=0;i<n;i++)seq.push(i%2?a:b);answer=(n%2?a:b);
  const oset=[answer];[a,b].forEach(c=>{if(!oset.includes(c))oset.push(c);});
  shuffle(SHAPES).forEach(c=>{if(oset.length<4&&!oset.includes(c))oset.push(c);});
  options=shuffle(oset);
 }else if(kind===1){ // number +k
  const start=1+Math.floor(Math.random()*9),k=1+Math.floor(Math.random()*(1+Math.floor(lvl/2)));
  const n=4;seq=[];for(let i=0;i<n;i++)seq.push(start+i*k);answer=start+n*k;
  const nset=[answer];[k,-k,1,-1,2].forEach(d=>{const v=answer+d;if(nset.length<4&&!nset.includes(v)&&v>0)nset.push(v);});
  options=shuffle(nset);
 }else{ // emoji order
  const set=rnd(EMOJI_SEQ);const s=Math.floor(Math.random()*2);
  const n=4;seq=set.slice(s,s+n);answer=set[s+n];
  const rest=set.filter(e=>!seq.includes(e)&&e!==answer);
  options=shuffle([answer,...shuffle(rest).slice(0,3)]);
 }
 $('prompt').textContent='What comes next?';
 const b=$('board');b.style.display='flex';b.style.flexWrap='wrap';
 seq.forEach(s=>{const t=document.createElement('div');t.className='tile pick';t.textContent=s;b.appendChild(t);});
 const q=document.createElement('div');q.className='tile';q.textContent='?';q.style.borderColor='#ffd93d';b.appendChild(q);
 const o=$('opts');
 options.forEach(op=>{const t=document.createElement('div');t.className='tile';t.textContent=op;
  onTap(t,()=>{if(lock)return;lock=true;clearInterval(timerId);
   if(op===answer){t.classList.add('correct');addScore();setTimeout(nextLevel,600);}
   else{t.classList.add('wrong');fail('Nope — it was '+answer);}});
  o.appendChild(t);});
}
// ---- MODE 3: matrix (latin square) ----
function buildMatrix(){
 const cols=shuffle(SHAPES.slice(0,3));
 // latin square
 const grid=[[cols[0],cols[1],cols[2]],[cols[1],cols[2],cols[0]],[cols[2],cols[0],cols[1]]];
 const mi=Math.floor(Math.random()*3),mj=Math.floor(Math.random()*3);
 const answer=grid[mi][mj];
 $('prompt').textContent='Which tile completes the pattern? Each row & column holds all three.';
 const b=$('board');b.style.gridTemplateColumns='repeat(3,1fr)';
 for(let i=0;i<3;i++)for(let j=0;j<3;j++){
  const t=document.createElement('div');t.className='tile';
  if(i===mi&&j===mj){t.textContent='?';t.style.borderColor='#ffd93d';}
  else t.textContent=grid[i][j];
  b.appendChild(t);
 }
 const wrongs=cols.filter(c=>c!==answer);
 const options=shuffle([answer,...wrongs]);
 const o=$('opts');
 options.forEach(op=>{const t=document.createElement('div');t.className='tile';t.textContent=op;
  onTap(t,()=>{if(lock)return;lock=true;clearInterval(timerId);
   if(op===answer){t.classList.add('correct');addScore();setTimeout(nextLevel,600);}
   else{t.classList.add('wrong');fail('Look for the missing one!');}});
  o.appendChild(t);});
}

function nextLevel(){lvl++;$('lvl').textContent=lvl;startRound();}
function gameOver(){
 clearInterval(timerId);
 $('game').style.display='none';$('over').style.display='flex';
 $('fScore').textContent=score;$('fLvl').textContent=lvl;
 if(score>best){best=score;localStorage.setItem('pm_best',best);$('fBest').textContent=best+' 🏆 NEW!';}
 else $('fBest').textContent=best;
 const v=$('over').querySelector('#verdict');
 v.textContent=lvl>=12?"Hades: 'Finally, a brain.' Lilith: 'Don't let it go to your head.'"
  :lvl>=7?"Hades: 'Acceptable. For a human.' Lilith: 'The patterns fear you. Slightly.'"
  :lvl>=4?"Lilith: 'You're seeing them now. Keep going.'"
  :"Hades: 'The tiles are laughing at you.' Lilith: 'Again. Slower this time.'";
}
function start(){
 lvl=1;score=0;lives=3;$('lvl').textContent=1;$('score').textContent=0;$('lives').textContent='❤❤❤';
 $('menu').style.display='none';$('over').style.display='none';$('game').style.display='flex';
 startRound();
}
onTap($('startBtn'),start);
onTap($('againBtn'),start);
</script>
</body>
</html>
