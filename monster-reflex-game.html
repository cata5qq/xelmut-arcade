<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monster Reflex ⚡</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#0b0b0d; color:#f2f2f2;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; }
  h1 { font-size:1.6rem; margin:8px 0 2px; letter-spacing:1px; }
  .sub { color:#9a9aa0; font-size:.9rem; margin-bottom:16px; }
  #arena { width:min(92vw,420px); aspect-ratio:1/1; border-radius:20px; display:flex;
           align-items:center; justify-content:center; text-align:center; font-size:1.5rem;
           font-weight:800; user-select:none; touch-action:manipulation; cursor:pointer;
           transition:background .12s; padding:20px; }
  .idle  { background:#1a1a1f; color:#c9c9d2; }
  .wait  { background:#c1121f; color:#fff; }
  .go    { background:#e8f4f8; color:#111; }   /* Monster White theme */
  .go    { box-shadow:0 0 40px rgba(120,200,255,.45); }
  #stats { margin-top:16px; font-size:1rem; color:#cfcfd8; line-height:1.7; text-align:center; }
  #round { margin-top:8px; color:#8b8b95; font-size:.85rem; }
  button { margin-top:14px; background:#00e054; border:none; border-radius:12px; padding:14px 34px;
           font-size:1.1rem; font-weight:800; cursor:pointer; color:#04120a; }
  #verdict { margin-top:14px; font-size:1.05rem; font-weight:700; text-align:center; max-width:420px; }
  .best { color:#ffd60a; font-weight:800; }
</style>
</head>
<body>
  <h1>⚡ MONSTER REFLEX ⚡</h1>
  <div class="sub">White-can edition. Wait for green. Tap fast. 5 rounds.</div>
  <div id="arena" class="idle">Tap START<br>then tap the moment<br>it goes green</div>
  <div id="round"></div>
  <div id="stats"></div>
  <div id="verdict"></div>
  <button id="btn" onclick="start()">START</button>

<script>
const arena = document.getElementById('arena'),
      stats = document.getElementById('stats'),
      roundEl = document.getElementById('round'),
      verdict = document.getElementById('verdict'),
      btn = document.getElementById('btn');
let state = 'idle', timer = null, t0 = 0, times = [], fouls = 0;
const BEST_KEY = 'monsterReflexBest';
let best = JSON.parse(localStorage.getItem(BEST_KEY) || 'null');

function start() {
  times = []; fouls = 0; verdict.textContent = '';
  btn.style.display = 'none';
  round(1);
}
function round(n) {
  state = 'wait';
  arena.className = 'wait'; arena.textContent = 'WAIT…';
  roundEl.textContent = 'Round ' + n + ' / 5' + (fouls ? ' · fouls: ' + fouls : '');
  clearTimeout(timer);
  timer = setTimeout(() => {
    state = 'go'; t0 = performance.now();
    arena.className = 'go'; arena.textContent = 'TAP!';
  }, 1800 + Math.random() * 3500);
}
arena.addEventListener('pointerdown', () => {
  if (state === 'wait') {
    fouls++; clearTimeout(timer);
    arena.className = 'idle'; arena.textContent = 'TOO EARLY! ⚠️\nTap to retry this round';
    state = 'fouled';
  } else if (state === 'fouled') {
    round(times.length + 1);
  } else if (state === 'go') {
    const ms = Math.round(performance.now() - t0);
    times.push(ms);
    if (best === null || ms < best) { best = ms; localStorage.setItem(BEST_KEY, best); }
    if (times.length >= 5) finish();
    else round(times.length + 1);
  }
});
function finish() {
  state = 'idle'; clearTimeout(timer);
  const avg = Math.round(times.reduce((a,b)=>a+b,0)/times.length);
  const top = Math.min(...times);
  let v;
  if (avg < 250)      v = '⚡ MONSTER-TIER reflexes. Hades is impressed. 🐕';
  else if (avg < 350) v = '🐾 Solid. Lilith approves. Try for sub-250.';
  else if (avg < 450) v = '🙂 Not bad — especially if it\'s 3am.';
  else                v = '💤 Hydration check: another White can, then retry.';
  arena.className = 'idle';
  arena.innerHTML = 'DONE<br><span style="font-size:2.6rem">🥫</span>';
  stats.innerHTML = 'Average: <b>' + avg + ' ms</b><br>Best round: <b>' + top + ' ms</b><br>' +
    'Best ever: <span class="best">' + best + ' ms</span>' + (fouls ? '<br>Fouls: ' + fouls : '');
  verdict.textContent = v;
  roundEl.textContent = '';
  btn.textContent = 'PLAY AGAIN'; btn.style.display = '';
  btn.onclick = start;
}
if (best !== null) stats.innerHTML = 'All-time best: <span class="best">' + best + ' ms</span>';
</script>
</body>
</html>
