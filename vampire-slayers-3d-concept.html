function proj(x,y,z){const c=Math.cos(A),s=Math.sin(A);

addEventListener('pointermove',e=>{if(down){A+=(e.clientX-lx)*0.008;lx=e.clientX;}});
addEventListener('pointerup',()=>down=false);
addEventListener('wheel',e=>{CAMD=Math.min(2400,Math.max(900,CAMD+e.deltaY));auto=false;},{passive:true});
addEventListener('resize',()=>{CX=innerWidth/2;CY=innerHeight/2-30;});
function frame(t){const dt=Math.min(0.05,(t-lastT)/1000||0.016);lastT=t;
if(auto)A+=dt*0.12;
const bx=170*Math.sin(t*0.00045),by=170*Math.sin(t*0.00031+1);
hero.x=bx;hero.y=by;hero.z=0;place(hero,proj(bx,by,0));
hexes.forEach((h,i)=>{const hx=320*Math.sin(t*0.0004+i*1.7),hy=320*Math.cos(t*0.00033+i*2.3);
h.z=14+10*Math.sin(t*0.002+i);place(h,proj(hx,hy,h.z));});
const pulse=1+0.03*Math.sin(t*0.003);
boss.x=-170;boss.y=-230;place(boss,proj(-170,-230,0));
const bp=proj(-170,-230,300*pulse*0.667+40);
bbar.style.width=(190*bp.k)+'px';bbar.style.left=(bp.x-95*bp.k)+'px';bbar.style.top=(bp.y-8)+'px';
bbar.style.zIndex=Math.round(20000-bp.d);
floor.style.transform=`rotateX(55deg) rotateZ(${A}rad)`;
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
