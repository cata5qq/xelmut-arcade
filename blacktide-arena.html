 if(runTime>=85&&windAt===90){windWarn=5;}if(runTime>=90&&windAt===90){windA+=Math.PI*.76;windAt=Infinity;}if(windWarn>0)windWarn-=dt;

 let max=130*windFactor(player.a)*(player.dash>0?1.45:1),tx=ix*max,ty=iy*max,accel=400;player.vx+=(tx-player.vx)*Math.min(1,accel*dt/Math.max(1,Math.hypot(tx-player.vx,ty-player.vy)));player.vy+=(ty-player.vy)*Math.min(1,accel*dt/Math.max(1,Math.hypot(tx-player.vx,ty-player.vy)));let sp=Math.hypot(player.vx,player.vy);if(sp>max&&player.dash<=0){player.vx*=max/sp;player.vy*=max/sp;}player.x=clamp(player.x+player.vx*dt,30,WW-30);player.y=clamp(player.y+player.vy*dt,30,WH-30);
 let alive=false;for(let i=0;i<64;i++)if(enemies[i].on){alive=true;break;}if(wave>0&&wave<3&&!alive&&!tele[0].on){if(waveDelay<=0)waveDelay=10;else if((waveDelay-=dt)<=0)makeWave();}if(wave===3&&!alive&&!tele[0].on){state='win';}
 for(let i=0;i<hashHead.length;i++)hashHead[i]=-1;for(let i=0;i<64;i++)hashNext[i]=-1;for(let i=0;i<64;i++){let e=enemies[i];if(e.on){let cell=(Math.floor(e.y/64)&31)*32+(Math.floor(e.x/64)&31);hashNext[i]=hashHead[cell];hashHead[cell]=i;}}
 for(let e of enemies)if(e.on){if(e.x<cam.x-96||e.x>cam.x+W+96||e.y<cam.y-96||e.y>cam.y+H+96)continue;let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx),speed=[110,85,150][e.type];e.a=a;e.vx+=(Math.cos(a)*speed-e.vx)*Math.min(1,dt*2);e.vy+=(Math.sin(a)*speed-e.vy)*Math.min(1,dt*2);e.x+=e.vx*dt+e.knx*dt;e.y+=e.vy*dt+e.kny*dt;e.knx*=Math.pow(.03,dt);e.kny*=Math.pow(.03,dt);e.hit=Math.max(0,e.hit-dt);e.flash=Math.max(0,e.flash-dt);if(e.lock>0){e.lock-=dt;if(e.boardTicks>0){e.boardT+=dt;if(e.boardT>=.83){e.boardT=0;e.boardTicks--;damageEnemy(e,40*(e.hp/e.max<.25?2:1));player.hp=Math.max(0,player.hp-15);}}}

 }

 for(let p of parts)if(p.on){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.t-=dt;if(p.t<=0)p.on=false;}

 if(tele[0].on){let q=screen(tele[0].x,tele[0].y),r=28+Math.sin(worldTime*8)*7;ctx.strokeStyle='#ff9c34';ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,r,0,TAU);ctx.stroke();}
 let ps=screen(player.x,player.y);if(muzzleT>0){let m=screen(muzzleX,muzzleY);sprite('muzzle_'+Math.min(3,Math.floor((.15-muzzleT)/.04)),m.x,m.y,34,34,muzzleA);}
 ctx.globalAlpha=.45;sprite('foam_0',ps.x,ps.y+23,40,18,player.a);ctx.globalAlpha=1;spriteNat('hero_'+facing(player.a),ps.x,ps.y,1);ctx.strokeStyle='#83df9a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(ps.x,ps.y+20,35,11,0,0,TAU);ctx.stroke();bar(ps.x,ps.y-72,player.hp/1000,58,6,'#55d681');
 // darkness canvas with radial transparent opening
 let f=fogCtx;f.clearRect(0,0,W,H);f.fillStyle='rgba(2,9,22,.86)';f.fillRect(0,0,W,H);let g=f.createRadialGradient(ps.x,ps.y,220,ps.x,ps.y,420);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');f.globalCompositeOperation='destination-out';f.fillStyle=g;f.fillRect(0,0,W,H);f.globalCompositeOperation='source-over';ctx.drawImage(fog,0,0);

function hud(){ctx.fillStyle='rgba(4,15,28,.82)';ctx.fillRect(18,16,240,84);ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText('HULL',30,39);bar(90,27,player.hp/1000,145,14,'#55d681');ctx.fillText('POWDER',30,69);bar(90,57,player.pow/100,145,14,'#d6a548');ctx.fillStyle='#fff';ctx.fillText('WAVE '+wave+' / 3',30,91);

 minimap();if(banner>0){banner-=STEP;ctx.fillStyle='rgba(3,10,17,.8)';ctx.fillRect(W/2-140,115,280,48);ctx.fillStyle='#ffdf9a';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText('WAVE '+wave,W/2,147);ctx.textAlign='left';}if(windWarn>0){ctx.fillStyle='rgba(5,12,20,.82)';ctx.fillRect(W/2-120,110,240,42);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('WIND SHIFT IN '+Math.ceil(windWarn),W/2,137);ctx.textAlign='left';}

function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
// Required pointerup-first tap binding, verbatim.
function onTap(el, fn) {
  if (!el || typeof el.addEventListener !== 'function') return;
  var lastFire = 0, dx0 = 0, dy0 = 0;
  function fire(e) { lastFire = Date.now(); fn(e); }
  el.addEventListener('pointerdown', function (e) { dx0 = e.clientX || 0; dy0 = e.clientY || 0; });
  el.addEventListener('pointerup', function (e) {
    var dx = (e.clientX || 0) - dx0, dy = (e.clientY || 0) - dy0;
    if (dx * dx + dy * dy > 100) return;
    fire(e);
  });
  el.addEventListener('click', function (e) {
    if (Date.now() - lastFire < 150) return; /* same gesture's duplicate */
    fire(e);
  });
}
