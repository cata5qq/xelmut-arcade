const stoneMat=new THREE.MeshStandardMaterial({color:0x5a5f6a,roughness:0.9});
const darkStone=new THREE.MeshStandardMaterial({color:0x3a3d46,roughness:0.95});
function prop(geo,mat,x,z,ry,s){const m=new THREE.Mesh(geo,mat);m.position.set(x,0,z);m.rotation.y=ry||0;if(s)m.scale.setScalar(s);m.castShadow=m.receiveShadow=true;scene.add(m);return m;}
const tombGeo=new THREE.BoxGeometry(0.9,1.4,0.35);
[[-6,-3,.3],[-7.5,1,-.2],[6.5,-2,.5],[7.8,2,-.4],[-3,-8,.1],[4,-9,-.3],[-9,-6,.6],[9,-7,-.5]].forEach(p=>{const t=prop(tombGeo,Math.random()<.5?stoneMat:darkStone,p[0],p[1],p[2]);t.position.y=0.55;t.rotation.z=(Math.random()-.5)*0.15;});
const pilGeo=new THREE.CylinderGeometry(0.55,0.65,1,10);
[[-10,-4,3.2],[10,-5,2.2],[-5,-12,4.5],[6,-13,1.6]].forEach(p=>{const c=prop(pilGeo,darkStone,p[0],p[1],Math.random()*3);c.position.y=p[2]/2;c.scale.y=p[2];});
for(let i=0;i<14;i++){const r=prop(new THREE.DodecahedronGeometry(0.25+Math.random()*0.35,0),darkStone,(Math.random()-.5)*24,(Math.random()-.5)*20,Math.random()*3);r.position.y=0.2;}

const rigs=[];
function joint(parent,x,y,z){const o=new THREE.Object3D();o.userData.isJoint=true;o.position.set(x,y,z);parent.add(o);return o;}
function mesh(geo,mat,parent,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);m.castShadow=true;parent.add(m);return m;}
const std=(c,r,me,e,ei)=>new THREE.MeshStandardMaterial({color:c,roughness:r==null?0.7:r,metalness:me||0,emissive:e||0x000000,emissiveIntensity:ei==null?1:ei});
// HEXSPITTER
function makeHex(x,z){
 const g=new THREE.Group();g.position.set(x,2.1,z);scene.add(g);
 const J={root:joint(g,0,0,0)};
 const body=mesh(new THREE.SphereGeometry(0.55,24,18),std(0x2a1840,0.55),J.root,0,0,0);
 J.eye=joint(J.root,0,0.15,0.42);
 mesh(new THREE.SphereGeometry(0.2,16,12),std(0x220022,0.3,0,0xff33ff,2.2),J.eye,0,0,0.08);
 J.tents=[];
 for(let i=0;i<6;i++){const a=i/6*Math.PI*2;const p=joint(J.root,Math.cos(a)*0.35,-0.35,Math.sin(a)*0.35);
  const t=mesh(new THREE.ConeGeometry(0.09,0.8,8),std(0x3a2455,0.6),p,0,-0.4,0);t.rotation.x=Math.PI;p.rotation.y=-a;J.tents.push(p);}
 rigs.push({g,J,base:2.1,ph:Math.random()*6,update(t){
  g.position.y=this.base+Math.sin(t*1.6+this.ph)*0.25;
  g.rotation.y=Math.sin(t*0.5+this.ph)*0.4;
  this.J.tents.forEach((p,i)=>{p.rotation.x=Math.sin(t*3+i*1.1+this.ph)*0.35;p.rotation.z=Math.cos(t*2.6+i+this.ph)*0.3;});
 }});
 return g;
}
makeHex(-4.5,-1);makeHex(4.5,-1);makeHex(-2.6,-4.5);

 mesh(new THREE.CapsuleGeometry(0.34,0.55,6,14),armor,J.hips,0,0.35,0);

 mesh(new THREE.SphereGeometry(0.26,18,14),skin,J.head,0,0.12,0);
 mesh(new THREE.ConeGeometry(0.2,0.45,10),std(0x8a6a3a,0.8),J.head,0,-0.18,0.1).rotation.x=Math.PI;
 J.shL=joint(J.hips,-0.42,0.62,0);J.shR=joint(J.hips,0.42,0.62,0);
 mesh(new THREE.BoxGeometry(0.2,0.75,0.2),armor,J.shL,0,-0.35,0);
 mesh(new THREE.BoxGeometry(0.2,0.75,0.2),armor,J.shR,0,-0.35,0);
 mesh(new THREE.CylinderGeometry(0.05,0.05,0.9,8),std(0x777788,0.4,0.8),J.shR,0,-0.75,0.25).rotation.x=Math.PI/2.4;
 J.hipL=joint(J.hips,-0.18,0.05,0);J.hipR=joint(J.hips,0.18,0.05,0);
 mesh(new THREE.BoxGeometry(0.24,0.95,0.24),cloth,J.hipL,0,-0.5,0);
 mesh(new THREE.BoxGeometry(0.24,0.95,0.24),cloth,J.hipR,0,-0.5,0);
 g.rotation.y=-0.25;
 rigs.push({g,J,ph:1,update(t){
  g.position.y=Math.abs(Math.sin(t*2.2))*0.06;
  this.J.shL.rotation.x=Math.sin(t*2.2)*0.35;this.J.shR.rotation.x=-Math.sin(t*2.2)*0.35;
  this.J.head.rotation.y=Math.sin(t*0.6)*0.4;
  this.J.hips.rotation.y=Math.sin(t*0.4)*0.08;
 }});
 return g;
}
makeBrannoc();
// BRASS BURROWER
function makeBurrower(){
 const g=new THREE.Group();g.position.set(0,0,-6.5);scene.add(g);
 const J={root:joint(g,0,0,0)};
 const shell=std(0x4a3520,0.45,0.75);
 const body=mesh(new THREE.SphereGeometry(1,28,20),shell,J.root,0,1.15,0);body.scale.set(1.5,1.0,2.0);
 J.head=joint(J.root,0,1.0,1.9);
 mesh(new THREE.SphereGeometry(0.55,20,14),shell,J.head,0,0,0.2);
 const eL=mesh(new THREE.SphereGeometry(0.11,10,8),std(0x000000,0.3,0,0xff6611,3),J.head,-0.25,0.15,0.6);
 const eR=mesh(new THREE.SphereGeometry(0.11,10,8),std(0x000000,0.3,0,0xff6611,3),J.head,0.25,0.15,0.6);
 const h1=mesh(new THREE.ConeGeometry(0.12,0.7,8),shell,J.head,-0.4,0.35,0.3);h1.rotation.z=0.5;h1.rotation.x=-0.5;
 const h2=mesh(new THREE.ConeGeometry(0.12,0.7,8),shell,J.head,0.4,0.35,0.3);h2.rotation.z=-0.5;h2.rotation.x=-0.5;
 J.legs=[];
 for(let s=-1;s<=1;s+=2)for(let i=0;i<3;i++){
  const p=joint(J.root,s*1.25,0.75,-0.9+i*0.9);
  const leg=mesh(new THREE.BoxGeometry(0.9,0.16,0.16),shell,p,s*0.45,-0.25,0);
  leg.rotation.z=s*-0.5;J.legs.push({p,s,i});
 }
 rigs.push({g,J,update(t){
  const b=1+Math.sin(t*1.2)*0.02;body.scale.set(1.5*b,1.0/b,2.0);
  this.J.legs.forEach(L=>{L.p.rotation.y=Math.sin(t*6+L.i*2.1+(L.s>0?Math.PI:0))*0.4;});
  this.J.head.rotation.y=Math.sin(t*0.5)*0.25;
  g.rotation.y=Math.sin(t*0.3)*0.06;
 }});
 return g;
}
makeBurrower();
// embers
const emberGeo=new THREE.BufferGeometry();const N=140;const pos=new Float32Array(N*3);
for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*26;pos[i*3+1]=Math.random()*9;pos[i*3+2]=(Math.random()-.5)*22;}
emberGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const embers=new THREE.Points(emberGeo,new THREE.PointsMaterial({color:0xff8844,size:0.09,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(embers);
// skeleton visualizer
const skelGroup=new THREE.Group();skelGroup.visible=false;scene.add(skelGroup);
const skelItems=[];
function buildSkeleton(){
 rigs.forEach(r=>{
  function walk(o){o.children.forEach(c=>{if(c.userData&&c.userData.isJoint){
   const geo=new THREE.BufferGeometry();const arr=new Float32Array(6);
   geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
   const line=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0x00ffcc}));
   line.frustumCulled=false;skelGroup.add(line);
   const dot=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,6),new THREE.MeshBasicMaterial({color:0x00ffcc,depthTest:false}));
   dot.renderOrder=999;skelGroup.add(dot);
   skelItems.push({arr,attr:geo.attributes.position,a:o,b:c,dot});walk(c);}});}
  walk(r.g);
 });
}
buildSkeleton();
const _sv=new THREE.Vector3();
function updateSkeleton(){skelItems.forEach(it=>{
 it.a.getWorldPosition(_sv);it.arr[0]=_sv.x;it.arr[1]=_sv.y;it.arr[2]=_sv.z;
 it.b.getWorldPosition(_sv);it.arr[3]=_sv.x;it.arr[4]=_sv.y;it.arr[5]=_sv.z;
 it.attr.needsUpdate=true;it.dot.position.copy(_sv);});}
// labels
const labels=[["Brannoc",0.5,2.6,2.5],["Hexspitter",-4.5,3.4,-1],["Hexspitter",4.5,3.4,-1],["Brass Burrower",0,3.4,-6.5],["❤ BOSS",0,4.1,-6.5]];
const labelDivs=labels.map(L=>{const d=document.createElement('div');d.className='tag3d';d.textContent=L[0];document.getElementById('app').appendChild(d);return{d,p:L.slice(1)};});
const bossBar=document.getElementById('bossbar');
// camera: FIXED, manual drag orbit only
let az=0.35,el=0.42,R=13.5;const tgt=V3(0,1.2,-1);
function camUpdate(){camera.position.set(tgt.x+R*Math.sin(az)*Math.cos(el),tgt.y+R*Math.sin(el),tgt.z+R*Math.cos(az)*Math.cos(el));camera.lookAt(tgt);}
camUpdate();
let drag=false,lx=0,ly=0;
addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointermove',e=>{if(drag){az-=(e.clientX-lx)*0.006;el=Math.min(1.2,Math.max(0.15,el+(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;camUpdate();}});
addEventListener('pointerup',()=>drag=false);
addEventListener('wheel',e=>{R=Math.min(22,Math.max(8,R+e.deltaY*0.01));camUpdate();},{passive:true});
document.getElementById('skelbtn').onclick=function(){skelGroup.visible=!skelGroup.visible;this.classList.toggle('on',skelGroup.visible);};
const pv=new THREE.Vector3();
function proj(x,y,z){pv.set(x,y,z).project(camera);return{x:(pv.x*0.5+0.5)*innerWidth,y:(-pv.y*0.5+0.5)*innerHeight};}
const clock=new THREE.Clock();
function frame(){
 const t=clock.getElapsedTime();
 rigs.forEach(r=>r.update(t));
 const pa=emberGeo.attributes.position;
 for(let i=0;i<N;i++){let y=pa.getY(i)+0.008;if(y>9)y=0;pa.setY(i,y);}
 pa.needsUpdate=true;
 if(skelGroup.visible)updateSkeleton();
 labelDivs.forEach(L=>{const s=proj(L.p[0],L.p[1],L.p[2]);L.d.style.transform=`translate(${s.x}px,${s.y}px) translate(-50%,-100%)`;});
 const bp=proj(0,3.6,-6.5);bossBar.style.transform=`translate(${bp.x}px,${bp.y}px) translate(-50%,0)`;
 renderer.render(scene,camera);
 requestAnimationFrame(frame);
}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body></html>
