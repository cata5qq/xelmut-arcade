const TEST_MODE = typeof globalThis !== 'undefined' && globalThis.TEST_MODE === true;
const WEAPONS = {

const ENEMIES = {ghoul:{hp:32,speed:40,damage:6,xp:1,r:12,color:'#fb476a'},bat:{hp:18,speed:76,damage:5,xp:1,r:9,color:'#bf6cff'},brute:{hp:170,speed:26,damage:18,xp:5,r:19,color:'#ff7b45'},spitter:{hp:64,speed:30,damage:8,xp:5,r:13,color:'#e33aa6'},lord:{hp:1400,speed:42,damage:24,xp:20,r:27,color:'#ff275f'},reaper:{hp:5200,speed:60,damage:50,xp:20,r:34,color:'#f5efff'}};
function createGame(opts={}) {

  const g={time:0,status:'playing',paused:false,level:1,xp:0,xpNext:12,kills:0,gold:0,hero:opts.hero||'vex',player:{x:0,y:0,hp:100,maxHp:100,regen:0,armor:0,speed:190,magnet:95,damage:1},weapons:{blades:{level:1,cd:0}},passives:{},enemies:[],projectiles:[],gems:[],particles:[],numbers:[],chests:[],cards:[],rerolls:3,banishes:2,spawnClock:0,bossesSpawned:[],evolutions:[],shake:0,flash:0,slowmo:0,iframes:0,elapsed:0,meta,events:[],input:{x:0,y:0},limits:{enemies:120,projectiles:200,particles:150,numbers:40}};

  if(g.hero==='rook'){g.player.maxHp+=10;g.player.hp=g.player.maxHp;g.weapons={cross:{level:1,cd:0}};}
  function nearest(x,y){let best=null,bd=Infinity;for(const e of g.enemies){const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;best=e;}}return best;}

  function spawnEnemy(type='ghoul',elite=false,x,y){if(g.enemies.length>=120)return null;const d=ENEMIES[type]||ENEMIES.ghoul,a=rand()*6.283,dist=500+rand()*180,e={type,elite,x:x??Math.cos(a)*dist,y:y??Math.sin(a)*dist,hp:d.hp*(elite?4:1),maxHp:d.hp*(elite?4:1),speed:d.speed,damage:d.damage,r:d.r*(elite?1.25:1),color:d.color,attack:1+rand(),xp:d.xp,elite,knock:0};g.enemies.push(e);return e;}
  function dropGem(e){const val=e.type==='lord'||e.type==='reaper'?20:e.elite?20:e.xp;g.gems.push({x:e.x,y:e.y,value:val,color:val>=20?'#ff446c':val>=5?'#48ff9b':'#41cfff',r:val>=20?7:5});}
  function damageEnemy(e,damage){if(!g.enemies.includes(e))return;e.hp-=damage;e.knock=.12;addNumber(e.x,e.y,Math.ceil(damage),'#fff1a8');if(e.hp<=0){g.enemies.splice(g.enemies.indexOf(e),1);g.kills++;dropGem(e);burst(e.x,e.y,e.color,3);if(e.elite||e.type==='lord'||e.type==='reaper')g.chests.push({x:e.x,y:e.y});}}
  function takeDamage(amount){if(g.iframes>0)return;const p=g.player;p.hp=Math.max(0,p.hp-Math.max(1,amount-p.armor));g.iframes=.5;g.shake=Math.max(g.shake,.16);if(p.hp<=0){if((upgrade('revival')>0)&&!g.revived){g.revived=true;p.hp=p.maxHp*.5;emit('revive');return;}endRun(false);}}
  function levelUpPick(i){if(g.status!=='levelup'||!g.cards[i])return false;const c=g.cards[i];if(c.type==='weapon'){if(g.weapons[c.id])g.weapons[c.id].level=Math.min(8,g.weapons[c.id].level+1);else g.weapons[c.id]={level:1,cd:0};}else if(c.type==='passive'){g.passives[c.id]=Math.min(5,(g.passives[c.id]||0)+1);applyPassive(c.id);}g.cards=[];g.status='playing';emit('pick',c);return true;}

  function endRun(victory){if(g.status==='dead'||g.status==='victory')return;g.status=victory?'victory':'dead';const earned=Math.floor(g.gold*(1+(g.passives.greed||0)*.1+upgrade('greed')*.1));meta.gold=(meta.gold||0)+earned;meta.bestTime=Math.max(meta.bestTime||0,g.time);meta.bestLevel=Math.max(meta.bestLevel||1,g.level);emit(victory?'victory':'death',{earned});if(typeof localStorage!=='undefined'&&!TEST_MODE){try{localStorage.setItem('vhs_save_v1',JSON.stringify(meta));}catch(_){}}}
  const costs=[50,100,200,400,800,1600];function buyUpgrade(id){const max=id==='revival'?2:6,n=upgrade(id);if(n>=max)return false;const cost=costs[Math.min(n,costs.length-1)];if((meta.gold||0)<cost)return false;meta.gold-=cost;meta.upgrades=meta.upgrades||{};meta.upgrades[id]=n+1;if(typeof localStorage!=='undefined'&&!TEST_MODE){try{localStorage.setItem('vhs_save_v1',JSON.stringify(meta));}catch(_){}}return true;}function unlockRook(){if(meta.heroes?.rook)return true;if((meta.gold||0)<500)return false;meta.gold-=500;meta.heroes=meta.heroes||{};meta.heroes.rook=true;return true;}
  function fire(){for(const[id,w]of Object.entries(g.weapons)){const def=WEAPONS[id],level=w.level,power=1+(g.passives.power||0)*.08+upgrade('might')*.05,haste=1-(g.passives.haste||0)*.06;w.cd-=g._dt;if(w.cd>0)continue;const target=nearest(g.player.x,g.player.y),count=def.count+Math.floor((level-1)/2);w.cd=def.cd*Math.max(.35,haste);if(!target&&def.kind!=='nova'&&def.kind!=='moon')continue;const dmg=def.damage*Math.pow(1.35,level-1)*power*(w.evolved?3.6:1);if(def.kind==='nova'){const radius=(w.evolved?210:74)*(1+(g.passives.faith||0)*.08);for(const e of [...g.enemies])if(Math.hypot(e.x-g.player.x,e.y-g.player.y)<radius)damageEnemy(e,dmg);burst(g.player.x,g.player.y,'#b73dff',w.evolved?20:8);continue;}if(def.kind==='moon'){for(const e of [...g.enemies])if(Math.hypot(e.x-g.player.x,e.y-g.player.y)<(w.evolved?440:170))damageEnemy(e,dmg*(w.evolved?1.5:1));continue;}if(def.kind==='bats'){for(let n=0;n<count;n++){if(g.projectiles.length>=200)break;const t=nearest(g.player.x+(rand()-.5)*180,g.player.y+(rand()-.5)*180);if(t)damageEnemy(t,dmg); }continue;}for(let n=0;n<count&&g.projectiles.length<200;n++){let dx=target.x-g.player.x,dy=target.y-g.player.y,len=Math.hypot(dx,dy)||1;const nx=dx/len,ny=dy/len,spread=(n-(count-1)/2)*.14,cs=Math.cos(spread),sn=Math.sin(spread);dx=nx*cs-ny*sn;dy=nx*sn+ny*cs;g.projectiles.push({x:g.player.x,y:g.player.y,vx:dx*def.speed,vy:dy*def.speed,life:id==='blades'?1.5:1.1,damage:dmg,pierce:id==='stake'?3:1,kind:def.kind,color:id==='cross'?'#ffe273':id==='stake'?'#f9f0ff':'#54f3ff'});}}}
  function tick(dt){if(!Number.isFinite(dt)||dt<=0||g.paused)return;if(g.status!=='playing'){g.elapsed+=dt;return;}g._dt=Math.min(dt,.1)*(g.slowmo>0?.35:1);g.time+=g._dt;g.elapsed+=dt;g.slowmo=Math.max(0,g.slowmo-dt);g.shake=Math.max(0,g.shake-dt);g.flash=Math.max(0,g.flash-dt);g.iframes=Math.max(0,g.iframes-dt);const p=g.player;p.x+=g.input.x*p.speed*g._dt;p.y+=g.input.y*p.speed*g._dt;p.hp=Math.min(p.maxHp,p.hp+p.regen*g._dt);

  g.spawnEnemy=spawnEnemy;g.gainXp=gainXp;g.damageEnemy=damageEnemy;g.takeDamage=takeDamage;g.openChest=openChest;g.levelUpPick=levelUpPick;g.reroll=reroll;g.banish=banish;g.restart=restart;g.buyUpgrade=buyUpgrade;g.unlockRook=unlockRook;g.tick=tick;g.endRun=endRun;g.setInput=(x,y)=>{let l=Math.hypot(x,y)||1;g.input={x:x/l,y:y/l};};g.stopInput=()=>{g.input={x:0,y:0};};g.nearest=nearest;return g;

class Renderer{constructor(game){this.g=game;this.c=document.querySelector('canvas');this.ctx=this.c.getContext('2d');this.resize();this.sprites={};this.makeSprites();this.last=0;this.hudTimer=0;this.hudStatus=null;this.keys={};this.bind();requestAnimationFrame(t=>this.frame(t));}resize(){const d=Math.min(devicePixelRatio||1,2);this.c.width=innerWidth*d;this.c.height=innerHeight*d;this.c.style.width=innerWidth+'px';this.c.style.height=innerHeight+'px';this.ctx.setTransform(d,0,0,d,0,0);this.w=innerWidth;this.h=innerHeight;}makeSprites(){for(const[type,d]of Object.entries(ENEMIES)){const c=document.createElement('canvas');c.width=c.height=(d.r*4)|0;const x=c.getContext('2d'),r=d.r*2;x.shadowColor=d.color;x.shadowBlur=12;x.fillStyle=d.color;x.beginPath();x.arc(r,r,d.r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();this.sprites[type]=c;}const chest=document.createElement('canvas');chest.width=chest.height=48;const chestCtx=chest.getContext('2d');chestCtx.shadowColor='#ffd64d';chestCtx.shadowBlur=16;chestCtx.fillStyle='#bd7d19';chestCtx.beginPath();chestCtx.roundRect(5,12,38,29,6);chestCtx.fill();chestCtx.shadowBlur=0;chestCtx.fillStyle='#ffd64d';chestCtx.fillRect(5,18,38,5);chestCtx.fillStyle='#fff0a6';chestCtx.beginPath();chestCtx.roundRect(20,21,8,11,2);chestCtx.fill();this.sprites.chest=chest;const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.shadowColor='#45f6ff';x.shadowBlur=20;x.fillStyle='#45f6ff';x.beginPath();x.moveTo(32,4);x.lineTo(55,53);x.lineTo(32,43);x.lineTo(9,53);x.fill();this.sprites.player=c;}bind(){addEventListener('resize',()=>this.resize());let active=false,origin=null;const pos=e=>({x:e.clientX,y:e.clientY});this.c.addEventListener('pointerdown',e=>{if(this.g.status!=='playing')return;this.c.setPointerCapture(e.pointerId);active=true;origin=pos(e);});this.c.addEventListener('pointermove',e=>{if(!active)return;const p=pos(e),dx=p.x-origin.x,dy=p.y-origin.y,l=Math.hypot(dx,dy);this.g.setInput(dx/Math.max(l,1),dy/Math.max(l,1));});this.c.addEventListener('pointerup',()=>{active=false;this.g.stopInput();});addEventListener('keydown',e=>{this.keys[e.key.toLowerCase()]=true;this.keyInput();});addEventListener('keyup',e=>{this.keys[e.key.toLowerCase()]=false;this.keyInput();});document.addEventListener('visibilitychange',()=>{this.g.paused=document.hidden;if(document.hidden)this.g.stopInput();});}keyInput(){const k=this.keys;this.g.setInput((k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0));}frame(now){const dt=Math.min(.05,(now-this.last)/1000||0);this.last=now;this.hudTimer+=dt;this.g.tick(dt);this.draw();requestAnimationFrame(t=>this.frame(t));}draw(){const g=this.g,c=this.ctx,w=this.w,h=this.h,p=g.player;c.clearRect(0,0,w,h);c.fillStyle='#10091b';c.fillRect(0,0,w,h);c.save();c.translate(w/2-p.x,h/2-p.y);c.strokeStyle='rgba(133,76,180,.11)';c.lineWidth=1;const gx=((p.x%64)+64)%64,gy=((p.y%64)+64)%64;for(let x=-w-gx;x<w;x+=64){c.beginPath();c.moveTo(x,-h);c.lineTo(x,h);c.stroke();}for(let y=-h-gy;y<h;y+=64){c.beginPath();c.moveTo(-w,y);c.lineTo(w,y);c.stroke();}for(const chest of g.chests)c.drawImage(this.sprites.chest,chest.x-24,chest.y-24,48,48);for(const m of g.gems){c.fillStyle=m.color;c.shadowColor=m.color;c.shadowBlur=10;c.beginPath();c.arc(m.x,m.y,m.r,0,7);c.fill();}c.shadowBlur=0;for(const b of g.projectiles){c.fillStyle=b.color;c.beginPath();c.arc(b.x,b.y,6,0,7);c.fill();}for(const e of g.enemies){const spr=this.sprites[e.type];if(spr)c.drawImage(spr,e.x-e.r*2,e.y-e.r*2,e.r*4,e.r*4);if(e.elite){c.strokeStyle='#ffd34d';c.lineWidth=3;c.beginPath();c.arc(e.x,e.y,e.r+4,0,7);c.stroke();}}for(const q of g.particles){c.globalAlpha=Math.max(0,q.life);c.fillStyle=q.color;c.fillRect(q.x,q.y,4,4);}c.globalAlpha=1;for(const n of g.numbers){c.globalAlpha=n.life/.7;c.fillStyle=n.color;c.fillText(n.text,n.x,n.y);}c.globalAlpha=1;c.drawImage(this.sprites.player,p.x-24,p.y-24,48,48);c.restore();const grad=c.createRadialGradient(w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.max(w,h)*.75);grad.addColorStop(0,'transparent');grad.addColorStop(1,'rgba(0,0,0,.72)');c.fillStyle=grad;c.fillRect(0,0,w,h);this.ui();}ui(){const g=this.g,el=document.getElementById('hud'),overlay=document.getElementById('overlay');if(this.hudTimer>=.15||this.hudTimer===0){this.hudTimer=0;el.innerHTML=`<b>☾ ${fmt(g.time)}</b><span>LV ${g.level}</span><span>☠ ${g.kills}</span><span>✦ ${g.gold}</span><div class="bars"><i style="width:${Math.max(0,g.player.hp/g.player.maxHp*100)}%"></i></div><small>${Math.floor(g.player.hp)}/${g.player.maxHp} HP　 ${g.xp}/${g.xpNext} XP</small>`;}if(g.status!==this.hudStatus){this.hudStatus=g.status;if(g.status==='levelup'){overlay.className='show';overlay.innerHTML=`<h1>LEVEL UP</h1><section>${g.cards.map((c,i)=>`<button onclick="pick(${i})"><b>${c.title}</b><small>${c.sub}</small></button>`).join('')}</section><p><button onclick="reroll()">REROLL ${g.rerolls}</button> <button onclick="banish(0)">BANISH ${g.banishes}</button></p>`;}else if(g.status==='dead'||g.status==='victory'){overlay.className='show';overlay.innerHTML=`<h1>${g.status==='victory'?'DAWN SURVIVED':'YOU WERE CONSUMED'}</h1><p>${fmt(g.time)} survived · ${g.kills} kills · ${g.gold} gold</p><button onclick="restart()">RESTART</button><button onclick="shop()">GOLD UPGRADES · ${g.meta.gold}</button>`;}else overlay.className='';}}}
function fmt(t){return `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;}let saved={};try{saved=JSON.parse(localStorage.getItem('vhs_save_v1')||'{}');}catch(_){}saved.upgrades=saved.upgrades||{};saved.heroes=saved.heroes||{rook:false};saved.gold=saved.gold||0;const game=createGame({meta:saved});window.vhs=game;window.pick=i=>game.levelUpPick(i);window.reroll=()=>game.reroll();window.banish=i=>game.banish(i);window.restart=()=>game.restart();window.shop=()=>{const o=document.getElementById('overlay');o.innerHTML='<h1>GOLD UPGRADES</h1><p>Banked gold: '+game.meta.gold+'</p>'+['might','swift','iron','heart','magnet','revival','greed'].map(k=>'<button onclick=\"buy(\''+k+'\')\">'+k.toUpperCase()+' · Lv '+(game.meta.upgrades[k]||0)+'</button>').join('')+'<button onclick=\"rook()\">'+(game.meta.heroes.rook?'ROOK UNLOCKED':'UNLOCK ROOK · 500 GOLD')+'</button><button onclick=\"restart()\">BACK</button>';};window.buy=k=>{game.buyUpgrade(k);shop();};window.rook=()=>{if(game.unlockRook())game.hero='rook';shop();};window.addEventListener('load',()=>new Renderer(game));}
</script></body></html>
